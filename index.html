,"status":"Non contattata","notes":""},{"id":"C061","name":"Revolut","industry":"SPAGNA • FINTECH","roles":"Italian AE / Account / Partnerships","priority":"Alta","hint":"Madrid e Spagna remote • IT+EN; livelli AE spesso senior","url":"https://www.revolut.com/careers/","status":"Non contattata","notes":""},{"id":"C062","name":"LSEG","industry":"SPAGNA • FINANCE DATA","roles":"Account Management / Client Success","priority":"Alta","hint":"Madrid • solo talent pool individuata; italiano utile","url":"https://www.google.com/search?q=LSEG+Madrid+Account+Manager+Italian+careers","status":"Non contattata","notes":""},{"id":"C063","name":"Chubb","industry":"SPAGNA • INSURTECH","roles":"Digital Operations / Customer / Account","priority":"Media","hint":"Madrid • processi AI, inglese+italiano; verificare esperienza settore","url":"https://careers.chubb.com/","status":"Non contattata","notes":""},{"id":"C064","name":"idealista","industry":"SPAGNA • MARKETPLACE","roles":"Key Account / Commercial / Operations","priority":"Media","hint":"Madrid • lingua spagnola da verificare","url":"https://www.google.com/search?q=idealista+careers+Italian+Madrid+jobs","status":"Non contattata","notes":""},{"id":"C065","name":"xNova International","industry":"SPAGNA • DATA TECH","roles":"Account Executive Italy / Customer Success","priority":"Media","hint":"Valencia • ruolo IT, possibili vincoli spagnolo","url":"https://www.google.com/search?q=xNova+International+Valencia+careers+Italian","status":"Non contattata","notes":""},{"id":"C066","name":"Avantio","industry":"SPAGNA • TRAVEL TECH","roles":"Customer Success / Account Management","priority":"Media","hint":"Valencia • spagnolo alto richiesto per ruolo oggi","url":"https://avantio.teamtailor.com/","status":"Non contattata","notes":""},{"id":"C067","name":"CoverManager","industry":"SPAGNA • HOSPITALITY TECH","roles":"Strategy & Ops / Customer Success / Partner","priority":"Alta","hint":"Siviglia • customer care italian, strategy richiede spagnolo fluente","url":"https://covermanager.recruitee.com/","status":"Non contattata","notes":""},{"id":"C068","name":"Metricool","industry":"SPAGNA • MARTECH","roles":"Account Executive Italy / Customer Success","priority":"Media","hint":"Remote in Spagna • spagnolo fluente richiesto ora","url":"https://www.google.com/search?q=Metricool+careers+Italian+market","status":"Non contattata","notes":""},{"id":"C069","name":"Shakers","industry":"SPAGNA • AI","roles":"Italian Account Executive / Commercial Ops","priority":"Media","hint":"Madrid • spagnolo + full cycle senior richiesti","url":"https://careers.shakersworks.com/jobs","status":"Non contattata","notes":""}]}</script>
<script>(()=>{'use strict';
const SEED=JSON.parse(document.getElementById('initialData').textContent);
const LSKEY='career-radar-sara-v2';
const STAGES=['Da valutare','Salvata','Candidata','Colloquio','Offerta'];
const ALLSTAGES=[...STAGES,'Scartata'];
const state={page:'dashboard',q:'',coq:'',country:'Tutti',city:'Tutte',sector:'Tutti',lingua:'compatibili',sort:'score',jobId:null,companyId:null};
const copy=x=>JSON.parse(JSON.stringify(x));
let store;
try{const saved=JSON.parse(localStorage.getItem(LSKEY)||'null');store=saved&&Array.isArray(saved.jobs)?saved:null;}catch(e){store=null;}
if(!store)store={jobs:copy(SEED.jobs),companies:copy(SEED.companies),lastSync:null,feedUrl:'./feed/jobs.json',createdAt:'2026-11-14'};
function persist(){try{localStorage.setItem(LSKEY,JSON.stringify(store))}catch(e){toast('Salvataggio nel browser non disponibile: esporta un backup')}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeUrl(v){try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)?esc(u.href):'#'}catch(e){return '#'}}
function text(v){return String(v||'').trim()}
function num(v){return Number.isFinite(+v)?+v:0}
function uid(){return 'USER-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6)}
function formatDate(d){if(!d)return '—';try{return new Date(d+'T12:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}catch(e){return d}}
function readableStatus(v){return v||'Da valutare'}
function statusCls(s){return s==='Salvata'?'saved':s==='Candidata'?'applied':s==='Colloquio'?'interview':s==='Offerta'?'offer':s==='Scartata'?'rejected':''}
function scoreClass(s){return +s>=4?'':+s>=3?'medium':'low'}
function iconFor(s){return (s||'?').replace(/[^\p{L}\p{N} ]/gu,'').trim().split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()||'✳'}
function continent(j){return j.country==='Spagna'?'Spagna':'Italia'}
function eligible(j){return !/spagnolo richiesto/i.test(j.language||'')}
function statusCount(...st){return store.jobs.filter(j=>st.includes(j.status)).length}
function toast(s){let root=document.getElementById('toastRoot');root.innerHTML='<div class="toast">'+esc(s)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>root.innerHTML='',3300)}
const navNames={dashboard:'Panoramica',jobs:'Opportunità',pipeline:'La mia pipeline',companies:'Aziende target',monitor:'Radar & alert',settings:'Dati & backup'};
function nav(page){state.page=page;state.q='';state.coq='';closeMobile();render();window.scrollTo({top:0,behavior:'smooth'})}
function closeMobile(){document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').classList.remove('open')}
function render(){document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.nav===state.page));document.getElementById('bread').innerHTML='Workspace <span>/</span> '+esc(navNames[state.page]);document.getElementById('sideJobCount').textContent=store.jobs.length;document.getElementById('syncMini').textContent=store.lastSync?'Feed '+formatDate(store.lastSync.slice(0,10)):'Archivio 14 nov 2026';let v=document.getElementById('view');v.innerHTML=({dashboard:renderDashboard,jobs:renderJobs,pipeline:renderPipeline,companies:renderCompanies,monitor:renderMonitor,settings:renderSettings}[state.page])();if(state.page==='jobs')updateJobList();if(state.page==='companies')updateCompanies();}
function header(k,title,subtitle){return `<div class="eyebrow">${esc(k)}</div><h1 class="page-title">${esc(title)}</h1><p class="page-sub">${esc(subtitle)}</p>`}
function mkScore(j){return `<span class="score ${scoreClass(j.score)}">${num(j.score).toFixed(1)} <small>/ 5</small></span>`}
function mini(j){return `<div class="job-mini"><div class="company-mark">${esc(iconFor(j.company))}</div><div class="job-mini-body"><button class="plain-click job-title" data-open-job="${esc(j.id)}">${esc(j.title)}</button><small>${esc(j.company)} · ${esc(j.city)} · ${esc(j.industry||'')}</small></div>${mkScore(j)}</div>`}
function renderDashboard(){let total=store.jobs.length,apps=statusCount('Candidata','Colloquio','Offerta'),interview=statusCount('Colloquio'),short=store.jobs.filter(x=>x.saved&&eligible(x)).length;
const high=store.jobs.filter(j=>eligible(j)&&j.status!=='Scartata').sort((a,b)=>+b.score-+a.score).slice(0,5);
const follow=store.jobs.filter(j=>j.followUp&&j.status!=='Scartata').sort((a,b)=>a.followUp.localeCompare(b.followUp)).slice(0,4);
const cityMap={};store.jobs.forEach(j=>cityMap[j.city||'Altro']=(cityMap[j.city||'Altro']||0)+1);const cities=Object.entries(cityMap).sort((a,b)=>b[1]-a[1]).slice(0,5);const max=cities[0]?.[1]||1;
return `${header('YOUR CAREER, YOUR RULES','Ciao! Pronta per la prossima mossa?','Un solo posto per scoprire aziende, scegliere offerte interessanti e seguire ogni candidatura. Non soltanto SDR.')}
<div class="hero"><div class="hero-main"><div class="hero-overline">BEYOND THE JOB TITLE ✳</div><h2>Il tuo prossimo ruolo può essere <em>molto più di SDR.</em></h2><p>Tech, sport, sponsorship, retail, partnership e customer success. Una ricerca costruita sulle tue competenze reali.</p><button class="btn btn-accent" data-nav-go="jobs">Esplora le opportunità &nbsp;↗</button></div><div class="hero-side"><div class="top"><span class="soft-tag">RICERCA IN 2 PAESI</span><span class="globe">🇮🇹 🇪🇸</span></div><h3>Milano, Madrid, Barcellona, Valencia, Siviglia</h3><p>Con priorità per italiano e inglese; gli annunci che richiedono spagnolo fluente sono evidenziati.</p></div></div>
<div class="kpi-grid"><div class="kpi"><div class="kpi-label">Opportunità nel radar <span class="kpi-icon">◇</span></div><div class="kpi-num">${total}</div><div class="kpi-bottom">Importate + aggiunte da te</div></div><div class="kpi"><div class="kpi-label">Nella tua shortlist <span class="kpi-icon">☆</span></div><div class="kpi-num">${short}</div><div class="kpi-bottom">Salvate e compatibili</div></div><div class="kpi"><div class="kpi-label">Candidature inviate <span class="kpi-icon">↗</span></div><div class="kpi-num">${apps}</div><div class="kpi-bottom">Inclusi colloqui e offerte</div></div><div class="kpi"><div class="kpi-label">Colloqui in corso <span class="kpi-icon">✺</span></div><div class="kpi-num">${interview}</div><div class="kpi-bottom">Tienili aggiornati in pipeline</div></div></div>
<div class="section-head"><h2 class="section-title">Dove concentrare l'energia</h2><button class="text-link" data-nav-go="jobs">Tutte le offerte →</button></div>
<div class="dashboard-split"><div class="panel"><div class="panel-head"><h3>✳ Le opportunità più in linea</h3><span class="chip">TOP FIT</span></div>${high.map(mini).join('')||'<div class="empty">Nessun annuncio disponibile</div>'}</div><div class="panel"><div class="panel-head"><h3>📍 La tua mappa delle opportunità</h3><span class="tag">Per città</span></div>${cities.map(([name,n])=>`<div class="city-row"><span class="city-name">${esc(name)}</span><div class="city-track"><div class="city-fill" style="width:${Math.max(6,n/max*100)}%"></div></div><span class="city-n">${n}</span></div>`).join('')}<div class="tip"><strong>${follow.length?'Prossimi follow-up':'La tua strategia'}</strong><div style="margin-top:6px">${follow.length?follow.map(j=>`<button class="plain-click" data-open-job="${esc(j.id)}">${esc(j.company)} · ${formatDate(j.followUp)}</button>`).join('<div style="height:6px"></div>'):'Salva le offerte interessanti, invia poche candidature curate e programma i follow-up. I dati rimangono solo su questo browser.'}</div></div></div></div>`}
function filteredJobs(){return store.jobs.filter(j=>{if(state.q&&!`${j.company} ${j.title} ${j.industry} ${j.location} ${j.reason}`.toLowerCase().includes(state.q.toLowerCase()))return false;if(state.country!=='Tutti'&&continent(j)!==state.country)return false;if(state.city!=='Tutte'&&j.city!==state.city)return false;if(state.sector!=='Tutti'&&!j.industry.toLowerCase().includes(state.sector.toLowerCase()))return false;if(state.lingua==='compatibili'&&!eligible(j))return false;if(state.lingua==='salvate'&&!j.saved)return false;if(state.lingua==='nuove'&&j.origin!=='Feed online')return false;return true}).sort((a,b)=>{if(state.sort==='company')return a.company.localeCompare(b.company);if(state.sort==='recent')return (b.addedAt||'').localeCompare(a.addedAt||'');if(state.sort==='city')return a.city.localeCompare(b.city);return +b.score-+a.score})}
function renderJobs(){let cities=[...new Set(store.jobs.map(j=>j.city).filter(Boolean))].sort();return `${header('OPPORTUNITY FINDER','Trova la tua prossima opportunità','Filtra tutte le offerte per città, settore e lingua. Apri una scheda per aggiungere note, salvare il link e gestire la candidatura.')}
<div class="toolbar"><label class="search-wrap"><span>⌕</span><input id="jobSearch" type="search" placeholder="Cerca azienda, ruolo, parola chiave..."></label><select class="filter-select" id="countryFilter">${['Tutti','Italia','Spagna'].map(x=>`<option ${state.country===x?'selected':''}>${x}</option>`).join('')}</select><select class="filter-select" id="cityFilter"><option ${state.city==='Tutte'?'selected':''}>Tutte</option>${cities.map(c=>`<option ${state.city===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select class="filter-select" id="sectorFilter"><option value="Tutti">Tutti i settori</option><option value="sport">Sport & eventi</option><option value="tech">Tech & SaaS</option><option value="retail">Retail</option><option value="fintech">Fintech</option><option value="travel">Travel</option><option value="AI">AI</option></select><select class="filter-select" id="sortFilter"><option value="score">Miglior affinità</option><option value="recent">Più recenti</option><option value="company">Azienda A–Z</option><option value="city">Città A–Z</option></select></div>
<div class="filter-toggles"><button class="pill-toggle ${state.lingua==='compatibili'?'selected':''}" data-lang="compatibili">✓ Senza spagnolo obbligatorio</button><button class="pill-toggle ${state.lingua==='tutte'?'selected':''}" data-lang="tutte">Tutte le offerte</button><button class="pill-toggle ${state.lingua==='salvate'?'selected':''}" data-lang="salvate">★ Solo salvate</button><button class="pill-toggle ${state.lingua==='nuove'?'selected':''}" data-lang="nuove">✳ Nuove dal feed</button></div><p class="countline" id="countLine"></p><div class="job-list" id="jobResults"></div>`}
function jobCard(j){let lbadge=j.language==='Spagnolo richiesto'?'<span class="lang-stop">ES richiesto</span>':j.language==='Lingua da verificare'?'<span class="lang-warning">lingua da verificare</span>':'';return `<div class="job-row"><div class="company-mark">${esc(iconFor(j.company))}</div><div class="job-main"><button class="plain-click job-title" data-open-job="${esc(j.id)}">${esc(j.title)}</button><div class="job-meta">${esc(j.company)} · ${esc(j.industry||'')} ${lbadge}</div></div><div class="job-location">${esc(j.city)}<div class="job-industry">${esc(j.country)}</div></div><span class="status-chip ${statusCls(j.status)}">${esc(readableStatus(j.status))}</span>${mkScore(j)}<button class="icon-star ${j.saved?'is-on':''}" data-toggle-save="${esc(j.id)}" aria-label="Salva offerta">${j.saved?'★':'☆'}</button></div>`}
function updateJobList(){if(state.page!=='jobs')return;const jobs=filteredJobs();document.getElementById('countLine').textContent=`${jobs.length} opportunità · ordinamento per ${state.sort==='score'?'affinità':state.sort==='recent'?'recenza':state.sort==='city'?'città':'azienda'}`;document.getElementById('jobResults').innerHTML=jobs.length?jobs.map(jobCard).join(''):'<div class="empty">◎ <strong>Nessun risultato per questi filtri</strong>Allarga la ricerca o mostra tutte le lingue.</div>';}
function renderPipeline(){let total=store.jobs.filter(j=>j.status!=='Da valutare'&&j.status!=='Scartata').length;return `${header('APPLICATION TRACKER','La tua pipeline','Trascina le candidature da una colonna all’altra, oppure apri la scheda per cambiare stato e aggiungere una data di follow-up.')}
<div class="inline-row" style="margin:22px 0"><span class="tag">${total} posizioni in lavorazione</span><span class="tag">${statusCount('Candidata')} CV inviati</span><span class="tag">${statusCount('Colloquio')} colloqui</span><button class="btn btn-outline" data-nav-go="jobs">Scopri nuove offerte ↗</button></div>

function normalize(j){let s={...j};s.id=text(j.id)||uid();s.company=text(j.company||j.azienda)||'Azienda';s.title=text(j.title||j.ruolo)||'Ruolo';s.location=text(j.location||j.city||j.citta||'');s.city=text(j.city||j.citta||'Altro');s.country=text(j.country||(/madrid|barcell|valencia|siviglia|sevilla|spagna|spain/i.test(s.location+s.city)?'Spagna':'Italia'));s.industry=text(j.industry||j.sector||'Altro');s.url=text(j.url||j.link||'');s.status=ALLSTAGES.includes(j.status)?j.status:'Da valutare';s.score=Math.min(5,Math.max(1,num(j.score)||3.5));s.language=text(j.language)||'Lingua da verificare';s.reason=text(j.reason);s.notes=text(j.notes);s.source=text(j.source)||'Feed';s.verification=text(j.verification)||'Nuovo feed';s.addedAt=text(j.addedAt)||new Date().toISOString().slice(0,10);s.saved=!!j.saved;s.followUp=text(j.followUp);s.appliedAt=text(j.appliedAt);s.contact=text(j.contact);s.salary=text(j.salary);s.origin=text(j.origin)||'Feed online';return s}
function mergeJobs(jobs,restore=false){let added=0,updated=0;const existingUrls=new Map(store.jobs.filter(j=>j.url).map(j=>[j.url.split('?')[0].replace(/\/$/,''),j]));const keys=new Set(store.jobs.map(j=>`${j.company}|${j.title}|${j.city}`.toLowerCase()));for(let raw of jobs){if(!raw||!raw.company||!raw.title)continue;const j=normalize(raw);const u=j.url.split('?')[0].replace(/\/$/,'');const key=`${j.company}|${j.title}|${j.city}`.toLowerCase();if((u&&existingUrls.has(u))||keys.has(key)){if(restore){let match=(u&&existingUrls.get(u))||store.jobs.find(x=>`${x.company}|${x.title}|${x.city}`.toLowerCase()===key);if(match){['status','saved','appliedAt','followUp','contact','notes','salary','language','url'].forEach(k=>{if(Object.prototype.hasOwnProperty.call(raw,k))match[k]=j[k]});}}updated++;continue}store.jobs.unshift(j);if(u)existingUrls.set(u,j);keys.add(key);added++}persist();render();return{added,updated}}
function parseCSV(str){let out=[],row=[],word='',quotes=false;for(let i=0;i<str.length;i++){let c=str[i];if(c==='"'){if(quotes&&str[i+1]==='"'){word+='"';i++}else quotes=!quotes}else if((c===','||c==='\n')&&!quotes){row.push(word);word='';if(c==='\n'){out.push(row);row=[]}}else if(c==='\r'&&!quotes){}else word+=c}row.push(word);out.push(row);let head=out.shift().map(s=>s.trim().replace(/^\ufeff/,''));return out.filter(r=>r.some(Boolean)).map(r=>Object.fromEntries(head.map((k,i)=>[k,r[i]])))}
async function readImport(e){let f=e.target.files[0];if(!f)return;try{let str=await f.text(),data=f.name.toLowerCase().endsWith('.csv')?{jobs:parseCSV(str)}:JSON.parse(str);if(!Array.isArray(data.jobs))throw Error('Il file deve avere una lista "jobs"');const restore=!!data.exportedAt;const r=mergeJobs(data.jobs,restore);let cs=0;if(Array.isArray(data.companies)){let set=new Map(store.companies.map(x=>[x.name.toLowerCase(),x]));for(let c of data.companies){if(!c.name)continue;let k=c.name.toLowerCase();if(set.has(k)){if(restore){let target=set.get(k);['priority','status','notes','url'].forEach(f=>{if(Object.prototype.hasOwnProperty.call(c,f))target[f]=c[f]});}}else{store.companies.push({...c,id:c.id||uid()});set.set(k,c);cs++}}persist()}toast(restore?`Backup ripristinato: ${r.updated} schede aggiornate, ${r.added} offerte aggiunte`:`${r.added} nuove offerte, ${cs} nuove aziende importate`)}catch(err){toast('Importazione fallita: '+err.message)}finally{e.target.value=''}}
async function syncFeed(silent=false){const url=text(store.feedUrl);if(!url){if(!silent)toast('Prima configura un URL feed in Dati & backup');return}try{const resp=await fetch(url,{cache:'no-store'});if(!resp.ok)throw Error('HTTP '+resp.status);const json=await resp.json();if(!Array.isArray(json.jobs))throw Error('Formato JSON non compatibile');const r=mergeJobs(json.jobs);store.lastSync=text(json.updatedAt)||new Date().toISOString();persist();if(!silent)toast(r.added?`${r.added} nuove offerte importate!`:'Feed controllato: nessuna nuova offerta');render()}catch(e){if(!silent)toast('Feed non disponibile: usa un URL HTTPS o pubblica su GitHub Pages')}}
// Centralized event delegation.
document.addEventListener('click',e=>{let b=e.target.closest('button,a');if(!b)return;if(b.dataset.nav){nav(b.dataset.nav);return}if(b.dataset.navGo){nav(b.dataset.navGo);return}if(b.dataset.openJob){openJob(b.dataset.openJob);return}if(b.dataset.openCompany){openCompany(b.dataset.openCompany);return}if(b.dataset.toggleSave){toggleSaved(b.dataset.toggleSave);return}if(b.hasAttribute('data-close-modal')){closeModal();return}switch(b.id){case'addTop':openAddJob();break;case'addCompany':openAddCompany();break;case'importTop':case'importData':document.getElementById('uploadFile').click();break;case'exportJSON':exportJSON();break;case'exportCSV':exportCSV();break;case'saveFeed':store.feedUrl=text(document.getElementById('feedUrl').value);persist();toast('Indirizzo feed salvato');break;case'syncNow':syncFeed(false);break;case'menuBtn':document.getElementById('sidebar').classList.add('open');document.getElementById('scrim').classList.add('open');break}});
document.addEventListener('change',e=>{let el=e.target;if(['countryFilter','cityFilter','sectorFilter','sortFilter'].includes(el.id)){let k={countryFilter:'country',cityFilter:'city',sectorFilter:'sector',sortFilter:'sort'}[el.id];state[k]=el.value;updateJobList()}});
document.addEventListener('input',e=>{if(e.target.id==='jobSearch'){state.q=e.target.value;updateJobList()}if(e.target.id==='companySearch'){state.coq=e.target.value;updateCompanies()}});
document.addEventListener('click',e=>{let b=e.target.closest('[data-lang]');if(b){state.lingua=b.dataset.lang;document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('selected',x.dataset.lang===state.lingua));updateJobList()}});
document.addEventListener('dragstart',e=>{const c=e.target.closest('[data-drag-job]');if(c)e.dataTransfer.setData('text/plain',c.dataset.dragJob)});
document.addEventListener('dragover',e=>{const col=e.target.closest('[data-drop-status]');if(col){e.preventDefault();col.classList.add('dragover')}});
document.addEventListener('dragleave',e=>{const col=e.target.closest('[data-drop-status]');if(col&&!col.contains(e.relatedTarget))col.classList.remove('dragover')});
document.addEventListener('drop',e=>{const col=e.target.closest('[data-drop-status]');if(!col)return;e.preventDefault();col.classList.remove('dragover');let id=e.dataTransfer.getData('text/plain'),j=store.jobs.find(x=>x.id===id);if(j){j.status=col.dataset.dropStatus;if(j.status==='Salvata')j.saved=true;persist();render();toast('Candidatura spostata → '+j.status)}});
document.getElementById('scrim').addEventListener('click',closeMobile);
document.getElementById('modalRoot').addEventListener('click',e=>{if(e.target.classList.contains('modal-overlay')||e.target.classList.contains('drawer-overlay'))closeModal()});
document.getElementById('uploadFile').addEventListener('change',readImport);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeMobile()}});
render();if(location.protocol==='https:'&&store.feedUrl)setTimeout(()=>syncFeed(true),700);
})();
</script>
</body></html>
